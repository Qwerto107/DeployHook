# 放在 nginx 的 http 上下文中；替换域名和证书路径。
limit_req_zone $server_name zone=deployhook_rate:1m rate=10r/m;
limit_conn_zone $server_name zone=deployhook_connections:1m;

server {
    listen 443 ssl;
    server_name deploy.example.com;
    ssl_certificate /etc/letsencrypt/live/deploy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    client_max_body_size 16k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 10s;
    limit_conn deployhook_connections 10;
    limit_conn_status 429;
    limit_req_status 429;

    # 公网多级路径映射为应用固定路由 /webhook，无需修改应用。
    location = /ops/hooks/production/deploy {
        limit_except POST { deny all; }
        limit_req zone=deployhook_rate burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 20s;
        proxy_send_timeout 5s;
        proxy_next_upstream off;
        # 只在 http 层限流，不修改签名所覆盖的请求体。
    }

    # 健康检查通过本机端口访问，公网只保留触发入口。
    location / { return 404; }
}
