[package]
name = "deployhook"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8"
hex = "0.4"
hmac = "0.12"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "process", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
