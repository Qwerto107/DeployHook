name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          # 标签格式必须为 x.y.z，且与 Cargo.toml 的版本一致。
          [[ "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 - <<'PY'
          import os
          import tomllib
          with open('Cargo.toml', 'rb') as file:
              version = tomllib.load(file)['package']['version']
          if version != os.environ['RELEASE_TAG']:
              raise SystemExit('Tag must match the package version in Cargo.toml')
          PY

      - name: Prepare toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-musl

      - name: Test and build
        run: |
          # 测试与发布构建均使用仓库已锁定的依赖版本。
          cargo test --locked
          cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package/deploy dist
          install -m 0755 target/x86_64-unknown-linux-musl/release/deployhook package/deployhook
          # 部署包只包含运行程序与配置示例，不包含源码、测试和开发文档。
          install -m 0644 deploy/deployhook.service deploy/deployhook.env.example deploy/nginx.conf package/deploy/
          tar -C package -czf "dist/deployhook-${RELEASE_TAG}-linux-x86_64.tar.gz" deployhook deploy
          cd dist
          sha256sum *.tar.gz > SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 新版本先创建草稿；重新发布同一版本时覆盖同名附件。
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
